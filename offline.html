<script id="v22-3-hopi-normalizer-js">
(function(){
  if(window.__STEP_SIM_V223_HOPI_PATCH) return;
  window.__STEP_SIM_V223_HOPI_PATCH = true;
  try{
    var ipad = window.__STEP_SIM_STORAGE_PROFILE === 'ipad-browser-library-primary';
    window.__STEP_SIM_VERSION = ipad ? 'A22.12' : '22.6';
    document.title = ipad ? 'Step Exam Simulator A22.13 iPad by Bladelord' : 'Step Exam Simulator v22.6 by Bladelord';
  }catch(e){}

  var MAIN_HEADINGS = {
    'patient information':1,
    'history':1,
    'physical examination':1,
    'physical exam':1,
    'laboratory studies':1,
    'laboratory study':1,
    'lab studies':1,
    'diagnostic studies':1,
    'diagnostic study':1,
    'diagnostics':1,
    'question':1
  };
  var SUBHEADINGS = {
    'reason for visit':1,
    'chief concern':1,
    'reason for visit/chief concern':1,
    'history of present illness':1,
    'past medical history':1,
    'medications':1,
    'allergies':1,
    'psychosocial history':1,
    'social history':1,
    'family history':1,
    'vaccinations':1,
    'immunizations':1,
    'review of systems':1
  };
  function norm(s){
    return String(s||'')
      .replace(/\u00a0/g,' ')
      .replace(/\s+/g,' ')
      .replace(/[:：]\s*$/,'')
      .trim()
      .toLowerCase();
  }
  function isShortLabelText(s){
    var t=String(s||'').replace(/\s+/g,' ').trim();
    return t && t.length <= 80 && !/[?.!][\s\S]+/.test(t.replace(/^Question\s*:/i,''));
  }
  function markFirstHeading(chart){
    try{
      var heads = Array.prototype.slice.call(chart.querySelectorAll('.hopi-main-heading,.hopi-question-line'));
      heads.forEach(function(h){h.classList.remove('hopi-first-main-heading');});
      if(heads[0]) heads[0].classList.add('hopi-first-main-heading');
    }catch(e){}
  }
  function wrapQuestionLabel(el){
    if(!el || el.dataset.v223QuestionWrapped) return;
    var txt=(el.textContent||'').replace(/\s+/g,' ').trim();
    if(!/^Question\s*:/i.test(txt)) return;
    el.classList.add('hopi-question-line');
    el.classList.remove('hopi-subheading');
    if(/^\s*Question\s*:\s*$/i.test(txt)){
      el.classList.add('hopi-main-heading');
      el.dataset.v223QuestionWrapped='1';
      return;
    }
    try{
      var html=el.innerHTML||'';
      if(!/hopi-question-label/.test(html)){
        var next=html.replace(/(^|>)(\s*)Question\s*:/i,function(m,p1,p2){
          return p1+p2+'<span class="hopi-main-heading-inline hopi-question-label">Question:</span>';
        });
        if(next!==html) el.innerHTML=next;
      }
      el.dataset.v223QuestionWrapped='1';
    }catch(e){}
  }
  function classifyElement(el){
    if(!el) return;
    var raw=(el.textContent||'').replace(/\s+/g,' ').trim();
    if(!raw) return;
    if(el.classList && el.classList.contains('hopi-question-label')) return;
    if(/^Question\s*:/i.test(raw)){
      wrapQuestionLabel(el);
      return;
    }
    /* Prefer the actual label node (b/strong/span/etc) over a wrapper <p>/<div>
       so margins/underline are applied once and do not duplicate parent + child. */
    if(el.children && el.children.length) return;
    if(!isShortLabelText(raw)) return;
    var n=norm(raw);
    if(MAIN_HEADINGS[n]){
      el.classList.add('hopi-main-heading');
      el.classList.remove('hopi-subheading');
      return;
    }
    if(SUBHEADINGS[n]){
      el.classList.add('hopi-subheading');
      return;
    }
  }
  function normalizePatientChartsV223(root){
    try{
      Array.prototype.slice.call((root||document).querySelectorAll('#examScreen .stem .patient-chart')).forEach(function(chart){
        chart.classList.add('patient-chart-v223');
        var selector='h1,h2,h3,h4,h5,h6,.chart-heading,.chart-main-heading,.chart-label,.chart-subheading,b,strong,p,div,span';
        Array.prototype.slice.call(chart.querySelectorAll(selector)).forEach(function(el){
          if(el===chart) return;
          classifyElement(el);
        });
        markFirstHeading(chart);
      });
    }catch(e){console.warn('v22.6 HOPI normalizer failed',e);}
  }
  window.normalizePatientChartsV223 = normalizePatientChartsV223;
  try{
    if(typeof renderQuestion === 'function' && !renderQuestion.__v223PatientChart){
      var baseRenderQuestionV223 = renderQuestion;
      renderQuestion = function(){
        var out = baseRenderQuestionV223.apply(this, arguments);
        normalizePatientChartsV223(document);
        return out;
      };
      renderQuestion.__v223PatientChart = true;
    }
  }catch(e){console.warn('v22.6 renderQuestion HOPI patch failed',e);}
  try{
    var mo = new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        var t=muts[i].target;
        if(t && t.querySelector && (t.matches && (t.matches('#examScreen') || t.matches('.stem') || t.matches('.patient-chart')) || t.querySelector('#examScreen .stem .patient-chart,.patient-chart'))){
          normalizePatientChartsV223(document);
          break;
        }
      }
    });
    mo.observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){normalizePatientChartsV223(document);}); else normalizePatientChartsV223(document);
})();
</script>

<script id="v22-13-hopi-invisible-table-borders-js">
(function(){
  if(window.__STEP_SIM_V2213_HOPI_TABLE_BORDERS) return;
  window.__STEP_SIM_V2213_HOPI_TABLE_BORDERS = true;
  function clean(s){ return String(s||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim(); }
  function norm(s){ return clean(s).replace(/[:：]\s*$/,'').toLowerCase(); }
  function sectionFromText(s){
    var n = norm(s);
    if(n === 'physical examination' || n === 'physical exam') return 'physical';
    if(n === 'diagnostic studies' || n === 'diagnostic study' || n === 'diagnostics') return 'diagnostic';
    if(n === 'patient information' || n === 'history' || n === 'laboratory studies' || n === 'laboratory study' || n === 'lab studies' || n === 'question') return 'other';
    return '';
  }
  function isTableNode(el){
    return !!(el && el.nodeType === 1 && (el.tagName === 'TABLE' || el.classList.contains('vitals-table') || el.classList.contains('stem-study-table')));
  }
  function isHeadingLike(el){
    if(!el || el.nodeType !== 1) return false;
    var tag = el.tagName;
    return /^(H1|H2|H3|H4|H5|H6|B|STRONG|SPAN|DIV|P)$/.test(tag) ||
      el.classList.contains('hopi-main-heading') || el.classList.contains('chart-heading') || el.classList.contains('chart-main-heading');
  }
  function directText(el){
    if(!el || !el.childNodes) return clean(el && el.textContent);
    var out = '';
    Array.prototype.slice.call(el.childNodes).forEach(function(n){
      if(n.nodeType === 3) out += ' ' + n.nodeValue;
      else if(n.nodeType === 1 && !/^(TABLE|UL|OL)$/.test(n.tagName)) out += ' ' + (n.textContent || '');
    });
    return clean(out);
  }
  function inferSectionFromPrevious(tbl){
    var node = tbl;
    var hops = 0;
    while(node && node.parentElement && hops < 20){
      var p = node.previousElementSibling;
      while(p){
        if(isHeadingLike(p)){
          var sec = sectionFromText(directText(p));
          if(sec) return sec;
        }
        p = p.previousElementSibling;
      }
      node = node.parentElement;
      if(node && node.classList && node.classList.contains('patient-chart')) break;
      hops++;
    }
    return '';
  }
  function normalizeHopiInvisibleTableBordersV2213(root){
    try{
      Array.prototype.slice.call((root||document).querySelectorAll('#examScreen .stem .patient-chart')).forEach(function(chart){
        var current = '';
        Array.prototype.slice.call(chart.querySelectorAll('h1,h2,h3,h4,h5,h6,.hopi-main-heading,.chart-heading,.chart-main-heading,.chart-label,.chart-subheading,b,strong,p,div,span,table,.vitals-table,.stem-study-table')).forEach(function(el){
          if(el === chart) return;
          if(el.closest && el.closest('table') && !isTableNode(el)) return;
          if(isTableNode(el)){
            var sec = current || inferSectionFromPrevious(el);
            if(sec === 'physical' || sec === 'diagnostic') el.classList.add('hopi-invisible-border-table');
            else el.classList.remove('hopi-invisible-border-table');
            return;
          }
          if(isHeadingLike(el)){
            var t = directText(el);
            if(t.length <= 120){
              var next = sectionFromText(t);
              if(next) current = next;
            }
          }
        });
      });
    }catch(e){ console.warn('v22.13 HOPI invisible table border patch failed', e); }
  }
  window.normalizeHopiInvisibleTableBordersV2213 = normalizeHopiInvisibleTableBordersV2213;
  try{
    if(typeof renderQuestion === 'function' && !renderQuestion.__v2213HopiInvisibleBorders){
      var baseRenderQuestionV2213 = renderQuestion;
      renderQuestion = function(){
        var out = baseRenderQuestionV2213.apply(this, arguments);
        normalizeHopiInvisibleTableBordersV2213(document);
        return out;
